<section class="forgot-page">

  <div class="forgot-glow glow-one"></div>
  <div class="forgot-glow glow-two"></div>

  <div class="forgot-container">

<div class="brand">
  <span class="brand-mark">M</span>

  <span class="brand-name">
    MOLI
  </span>
</div>

<div class="forgot-card">

  <div class="forgot-heading">

    <span class="eyebrow">
      ACCOUNT RECOVERY
    </span>

    <h1>
      Reset your password.
    </h1>

    <p>
      Enter your email and choose a new password for your Moli account.
    </p>

  </div>

  <form
    class="forgot-form"
    (ngSubmit)="resetPassword()"
  >

    <label>
      <span>Email</span>

      <input
        type="email"
        name="email"
        [(ngModel)]="email"
        placeholder="you@example.com"
        autocomplete="email"
        required
      >
    </label>

    <label>
      <span>New Password</span>

      <input
        type="password"
        name="newPassword"
        [(ngModel)]="newPassword"
        placeholder="At least 6 characters"
        autocomplete="new-password"
        required
      >
    </label>

    <label>
      <span>Confirm New Password</span>

      <input
        type="password"
        name="confirmPassword"
        [(ngModel)]="confirmPassword"
        placeholder="Enter your password again"
        autocomplete="new-password"
        required
      >
    </label>

    @if (error) {

      <div class="message error-message">
        <span>!</span>
        {{ error }}
      </div>

    }

    @if (success) {

      <div class="message success-message">
        <span>✓</span>
        {{ success }}
      </div>

    }

    <button
      type="submit"
      class="reset-submit"
      [disabled]="loading"
    >

      @if (loading) {
        <span class="button-loader"></span>
        Resetting password...
      } @else {
        Reset Password
      }

    </button>

  </form>

  <div class="login-row">

    <span>
      Remember your password?
    </span>

    <a routerLink="/login">
      Back to Login
    </a>

  </div>

</div>

<a
  routerLink="/home"
  class="back-home"
>
  ← Back to Moli
</a>

  </div>

</section>
